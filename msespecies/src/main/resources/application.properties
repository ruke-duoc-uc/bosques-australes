spring.application.name=msespecies
server.port=8082
spring.datasource.url=jdbc:h2:file:./data/especiesdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Ya que no se utiliza Flyway esta propiedad debe estar en "create" o "update"
# de lo contrario no se creara la base de datos
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.profiles.active=dev
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enable=true
springdoc.swagger-ui.path=/doc/swagger-ui.html