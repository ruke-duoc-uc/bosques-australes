server:
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: especies-routes
          uri: ${MS_ESPECIES_URI:http://localhost:8082}
          predicates:
            - Path=/api/especies/**

        - id: predios-routes
          uri: ${MS_PREDIOS_URI:http://localhost:8080}
          predicates:
            - Path=/api/predios/**

        - id: factura-routes
          uri: ${MS_FACTURA_URI:http://localhost:8084}
          predicates:
            - Path=/api/factura/**

        - id: planCosecha-routes
          uri: ${MS_PLANCOSECHA_URI:http://localhost:8089}
          predicates:
            - Path=/api/planCosecha/**

        - id: acopio-routes
          uri: ${MS_ACOPIO_URI:http://localhost:8088}
          predicates:
            - Path=/api/acopio/**

        - id: cuadrilla-routes
          uri: ${MS_CUADRILLA_URI:http://localhost:8087}
          predicates:
            - Path=/api/cuadrilla/**

        - id: trabajadores-routes
          uri: ${MS_TRABAJADORES_URI:http://localhost:8086}
          predicates:
            - Path=/api/trabajadores/**

        - id: despacho-routes
          uri: ${MS_DESPACHO_URI:http://localhost:8083}
          predicates:
            - Path=/api/despacho/**

#centralizar swagger en gateway
springdoc:
  swagger-ui:
    urls:
      - name: API Especies
        url: /api/especies/v3/api-docs
      - name: API Predios
        url: /api/predios/v3/api-docs
      - name: API Factura
        url: /api/factura/v3/api-docs
      - name: API Plan Cosecha
        url: /api/planCosecha/v3/api-docs
      - name: API Acopio
        url: /api/acopio/v3/api-docs
      - name: API Trabajadores
        url: /api/trabajadores/v3/api-docs
      - name: API Despacho
        url: /api/despacho/v3/api-docs
      - name: API Cuadrilla
        url: /api/cuadrilla/v3/api-docs