spring.application.name=msfactura
server.port=8089
spring.datasource.url=jdbc:h2:file:./data/facturadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
# Ya que no se utiliza Flyway esta propiedad debe estar en "create" o "update"
# de lo contrario no se creara la base de datos
spring.profiles.active=dev
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enable=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
ms.factura.url=${MS_FACTURA_URL:http://localhost:8084}