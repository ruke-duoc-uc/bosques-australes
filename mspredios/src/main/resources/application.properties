spring.application.name=mspredios
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/prediosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.profiles.active=dev
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enable=true
ms.predios.url=${MS_PREDIOS_URL:http://localhost:8080}
springdoc.api-docs.path=/api/predios/v3/api-docs